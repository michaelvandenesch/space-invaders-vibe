<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2.5rem);
            letter-spacing: 0.25em;
            text-align: center;
            color: #fff;
        }
        #game {
            display: block;
            background: #000;
            border: 1px solid #fff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
        #stage {
            position: relative;
        }
        #quitBtn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            padding: 6px 10px;
            cursor: pointer;
            display: none;
        }
        #quitBtn.visible { display: block; }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            letter-spacing: 0.15em;
            visibility: hidden;
        }
        #hud.visible { visibility: visible; }
    </style>
</head>
<body>
    <div id="app">
        <h1>SPACE INVADERS</h1>
        <div id="stage">
            <canvas id="game"></canvas>
            <button id="quitBtn" type="button">QUIT</button>
        </div>
        <div id="hud">
            <span id="scoreLabel">SCORE: 0000</span>
            <span id="waveLabel">WAVE 1</span>
        </div>
    </div>

    <script type="module">
        import {
            PLAYER_SPRITE, BULLET_SPRITE, ALIEN_BULLET_SPRITE, BUNKER_SPRITE,
            TUX_SPRITE, WINDOWS_SPRITE, CREEPER_SPRITE,
            drawSprite, spriteWidth, spriteHeight
        } from './js/sprites.js';

        // ---------- Browser-/Device-Detection ----------
        const isTouch = 'ontouchstart' in window
            || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        window.__isTouch = isTouch; // global verfuegbar fuer spaetere Phasen

        // ---------- Canvas-Setup, responsive 4:3 ----------
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const maxWidth = 800;
            const titleAndPadding = 120;
            const availW = window.innerWidth * 0.95;
            const availH = window.innerHeight - titleAndPadding;

            let w = Math.min(maxWidth, availW);
            let h = w * 3 / 4;
            if (h > availH) {
                h = availH;
                w = h * 4 / 3;
            }
            canvas.width  = Math.floor(w);
            canvas.height = Math.floor(h);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            resetPlayerPosition();
            computeFormation();
            if (state !== STATE.START) buildBunkers();
        });
        resizeCanvas();

        // ---------- Sprite-Skalierung ----------
        function getSpriteScale(baseFactor = 1) {
            const factor = canvas.width >= 600 ? 3 : 2;
            return factor * baseFactor;
        }

        // ---------- Spielerzustand ----------
        const player = {
            x: 0,
            y: 0,
            speed: 0 // px/s, wird pro Frame anhand Canvas-Breite gesetzt
        };

        function resetPlayerPosition() {
            const scale = getSpriteScale();
            const w = spriteWidth(PLAYER_SPRITE) * scale;
            const h = spriteHeight(PLAYER_SPRITE) * scale;
            player.x = (canvas.width - w) / 2;
            player.y = canvas.height - h - 30;
        }
        resetPlayerPosition();

        // ---------- Audio (Web Audio API, lazy + iOS-Unlock) ----------
        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                const Ctor = window.AudioContext || window.webkitAudioContext;
                if (Ctor) audioCtx = new Ctor();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        function playPew() {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, t0);
            osc.frequency.exponentialRampToValueAtTime(200, t0 + 0.08);
            gain.gain.setValueAtTime(0.15, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.09);
        }
        const MARCH_FREQS = [100, 90, 80, 70];
        function playMarch(step) {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(MARCH_FREQS[step % 4], t0);
            gain.gain.setValueAtTime(0.08, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.11);
        }
        function playHit() {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            // 50ms Noise-Burst via Buffer
            const sr = audioCtx.sampleRate;
            const len = Math.floor(sr * 0.05);
            const buf = audioCtx.createBuffer(1, len, sr);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.2;
            src.connect(gain).connect(audioCtx.destination);
            src.start(t0);
        }
        function playGameOver() {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, t0);
            osc.frequency.exponentialRampToValueAtTime(50, t0 + 1.0);
            gain.gain.setValueAtTime(0.18, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 1.05);
        }
        // User-Geste -> Audio entsperren
        ['keydown', 'click', 'touchstart'].forEach(ev => {
            window.addEventListener(ev, ensureAudio, { passive: true });
        });

        // ---------- Input: Tastatur ----------
        const keys = Object.create(null);
        document.addEventListener('keydown', (e) => {
            // Space normalisieren auf 'Space'
            const k = (e.key === ' ' || e.code === 'Space') ? 'Space' : e.key;
            keys[k] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const k = (e.key === ' ' || e.code === 'Space') ? 'Space' : e.key;
            keys[k] = false;
        });

        // ---------- Input: Touch (Drag) ----------
        let touchTargetX = null; // Ziel-X (Mitte des Schiffs) in Canvas-Koordinaten

        function handleTouch(e) {
            if (!e.touches || e.touches.length === 0) return;
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const cssX = t.clientX - rect.left;
            touchTargetX = cssX * (canvas.width / rect.width);
            e.preventDefault();
        }
        function endTouch(e) {
            touchTargetX = null;
        }
        canvas.addEventListener('touchstart',  handleTouch, { passive: false });
        canvas.addEventListener('touchmove',   handleTouch, { passive: false });
        canvas.addEventListener('touchend',    endTouch,    { passive: false });
        canvas.addEventListener('touchcancel', endTouch,    { passive: false });

        // ---------- Touch Auto-Fire ----------
        // Auf Touch-Devices alle 500ms automatisch schiessen, solange PLAYING.
        if (isTouch) {
            setInterval(() => {
                if (state === 'PLAYING') keys['Space'] = true;
            }, 500);
        }

        // ---------- Geschosse ----------
        const bullets = [];
        let lastShoot = 0;
        const SHOOT_COOLDOWN_MS = 250;

        function tryShoot() {
            const now = Date.now();
            if (now - lastShoot < SHOOT_COOLDOWN_MS) return;
            lastShoot = now;

            const scale = getSpriteScale();
            const pw = spriteWidth(PLAYER_SPRITE) * scale;
            const bw = spriteWidth(BULLET_SPRITE) * scale;
            const bh = spriteHeight(BULLET_SPRITE) * scale;

            bullets.push({
                x: player.x + pw / 2 - bw / 2,
                y: player.y - bh
            });
            playPew();

            // Auto-Fire-Trigger sofort zuruecksetzen, naechster Tick setzt wieder true
            if (isTouch) keys['Space'] = false;
        }

        // ---------- Alien-Formation ----------
        // Reihe 0: TUX (30), Reihen 1-2: WINDOWS (20), Reihe 3: CREEPER (10)
        const ALIEN_ROWS = 4;
        const ALIEN_COLS = 11;
        const ALIEN_TYPES = [
            { sprite: TUX_SPRITE,     points: 30 },
            { sprite: WINDOWS_SPRITE, points: 20 },
            { sprite: WINDOWS_SPRITE, points: 20 },
            { sprite: CREEPER_SPRITE, points: 10 }
        ];
        // Einheitliche Zellbreite/-hoehe basierend auf groesstem Sprite
        const ALIEN_CELL_W = Math.max(
            spriteWidth(TUX_SPRITE),
            spriteWidth(WINDOWS_SPRITE),
            spriteWidth(CREEPER_SPRITE)
        );
        const ALIEN_CELL_H = Math.max(
            spriteHeight(TUX_SPRITE),
            spriteHeight(WINDOWS_SPRITE),
            spriteHeight(CREEPER_SPRITE)
        );

        const aliens = [];
        for (let r = 0; r < ALIEN_ROWS; r++) {
            for (let c = 0; c < ALIEN_COLS; c++) {
                aliens.push({ row: r, col: c, alive: true, type: r });
            }
        }

        // Formations-Layout (wird bei Resize neu berechnet)
        const formation = {
            scale: 3,
            colSpacing: 0,
            rowSpacing: 0,
            offsetX: 0,
            offsetY: 0,
            dir: 1, // 1 = rechts, -1 = links
            blockW: 0,
            blockH: 0
        };

        function computeFormation() {
            const mobile = canvas.width < 600;
            // Basis-Skalierung: Desktop 3, Mobile 1.5
            let scale = mobile ? 1.5 : 3;

            // Spacing in % der Sprite-Zellbreite/-hoehe
            // Spalten dynamisch reduzieren, damit Block + 15% Padding pro Seite passt
            const maxBlockW = canvas.width * 0.7;
            let colSpacing;
            // Probiere Skalierung ggf. reduzieren
            while (true) {
                const renderW = ALIEN_CELL_W * scale;
                colSpacing = Math.max(2, renderW * 0.25);
                const blockW = renderW * ALIEN_COLS + colSpacing * (ALIEN_COLS - 1);
                if (blockW <= maxBlockW || scale <= 0.5) break;
                scale -= 0.1;
            }

            const renderW = ALIEN_CELL_W * scale;
            const renderH = ALIEN_CELL_H * scale;
            const rowSpacing = mobile ? canvas.height * 0.03 : canvas.height * 0.05;
            const blockW = renderW * ALIEN_COLS + colSpacing * (ALIEN_COLS - 1);
            const blockH = renderH * ALIEN_ROWS + rowSpacing * (ALIEN_ROWS - 1);
            const topPad = (mobile ? 0.08 : 0.13) * canvas.height;

            formation.scale = scale;
            formation.colSpacing = colSpacing;
            formation.rowSpacing = rowSpacing;
            formation.offsetX = (canvas.width - blockW) / 2;
            formation.offsetY = topPad;
            formation.blockW = blockW;
            formation.blockH = blockH;
        }
        computeFormation();

        function alienRenderPos(a) {
            const renderW = ALIEN_CELL_W * formation.scale;
            const renderH = ALIEN_CELL_H * formation.scale;
            const x = formation.offsetX + a.col * (renderW + formation.colSpacing);
            const y = formation.offsetY + a.row * (renderH + formation.rowSpacing);
            // Sprite innerhalb der Zelle zentrieren
            const sw = spriteWidth(ALIEN_TYPES[a.type].sprite) * formation.scale;
            const sh = spriteHeight(ALIEN_TYPES[a.type].sprite) * formation.scale;
            return { x: x + (renderW - sw) / 2, y: y + (renderH - sh) / 2, w: sw, h: sh };
        }

        // Tempo: linear 900ms (44 alive) -> 150ms (1 alive)
        function alienTickInterval(aliveCount) {
            if (aliveCount <= 1) return 150;
            return 150 + (900 - 150) * (aliveCount - 1) / (ALIEN_ROWS * ALIEN_COLS - 1);
        }

        let lastAlienTick = 0;
        let marchStep = 0;

        function stepAliens() {
            const renderW = ALIEN_CELL_W * formation.scale;
            const stepX = renderW * 0.2; // horizontaler Schritt
            const stepY = canvas.height * 0.045;

            // Lebende Aliens links/rechts pruefen
            let minX = Infinity, maxX = -Infinity;
            for (const a of aliens) {
                if (!a.alive) continue;
                const p = alienRenderPos(a);
                if (p.x < minX) minX = p.x;
                if (p.x + p.w > maxX) maxX = p.x + p.w;
            }
            if (minX === Infinity) return; // keine mehr

            const nextMin = minX + stepX * formation.dir;
            const nextMax = maxX + stepX * formation.dir;
            if (nextMax > canvas.width || nextMin < 0) {
                formation.dir *= -1;
                formation.offsetY += stepY;
            } else {
                formation.offsetX += stepX * formation.dir;
            }

            playMarch(marchStep++);
        }

        function aliveAliens() {
            let n = 0;
            for (const a of aliens) if (a.alive) n++;
            return n;
        }
        // ---------- Alien-Geschosse ----------
        const alienBullets = [];
        let nextAlienShootAt = 0;

        function scheduleNextAlienShot() {
            // 1-2 Sekunden, durch speedMultiplier beschleunigt
            const ms = (1000 + Math.random() * 1000) / Math.max(1, speedMultiplier);
            nextAlienShootAt = performance.now() + ms;
        }

        function alienShoot() {
            // Pro Spalte: tiefster lebender Alien
            const lowestPerCol = new Map();
            for (const a of aliens) {
                if (!a.alive) continue;
                const cur = lowestPerCol.get(a.col);
                if (!cur || a.row > cur.row) lowestPerCol.set(a.col, a);
            }
            if (lowestPerCol.size === 0) return;
            const shooters = [...lowestPerCol.values()];
            const shooter = shooters[Math.floor(Math.random() * shooters.length)];
            const p = alienRenderPos(shooter);
            const scale = getSpriteScale();
            const bw = spriteWidth(ALIEN_BULLET_SPRITE) * scale;
            alienBullets.push({
                x: p.x + p.w / 2 - bw / 2,
                y: p.y + p.h
            });
        }

        // ---------- Bunker ----------
        const BUNKER_COUNT = 4;
        const bunkers = []; // { grid, x, y, scale }

        function bunkerScale() {
            return canvas.width >= 600 ? 3 : 1.5;
        }

        function buildBunkers() {
            bunkers.length = 0;
            const scale = bunkerScale();
            const w = spriteWidth(BUNKER_SPRITE) * scale;
            const h = spriteHeight(BUNKER_SPRITE) * scale;
            const yRatio = canvas.width >= 600 ? 0.75 : 0.60;
            const y = canvas.height * yRatio - h / 2;
            // gleichmaessig zwischen 10% und 90% Canvas-Breite
            const left = canvas.width * 0.1;
            const right = canvas.width * 0.9;
            const slot = (right - left) / BUNKER_COUNT;
            for (let i = 0; i < BUNKER_COUNT; i++) {
                const cx = left + slot * (i + 0.5);
                bunkers.push({
                    grid: BUNKER_SPRITE.map(row => row.split('')),
                    x: cx - w / 2,
                    y: y,
                    scale: scale
                });
            }
        }

        function bunkerPixelHit(bunker, bx, by, bw, bh) {
            // Pruefe Pixel-Genau, ob Geschoss-Box ein gefuelltes Pixel beruehrt.
            // Bei Treffer: Pixel + kleine Umgebung loeschen, return true.
            const s = bunker.scale;
            const rows = bunker.grid.length;
            const cols = bunker.grid[0].length;
            // Berechne Pixel-Indizes der Box
            const c0 = Math.max(0, Math.floor((bx - bunker.x) / s));
            const c1 = Math.min(cols - 1, Math.floor((bx + bw - 1 - bunker.x) / s));
            const r0 = Math.max(0, Math.floor((by - bunker.y) / s));
            const r1 = Math.min(rows - 1, Math.floor((by + bh - 1 - bunker.y) / s));
            if (c1 < 0 || r1 < 0 || c0 >= cols || r0 >= rows) return false;

            let hitR = -1, hitC = -1;
            for (let r = r0; r <= r1; r++) {
                for (let c = c0; c <= c1; c++) {
                    if (bunker.grid[r][c] !== '.') {
                        hitR = r; hitC = c; break;
                    }
                }
                if (hitR !== -1) break;
            }
            if (hitR === -1) return false;

            // Chunk loeschen: 3x3 um Trefferpunkt
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const rr = hitR + dr, cc = hitC + dc;
                    if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) {
                        bunker.grid[rr][cc] = '.';
                    }
                }
            }
            return true;
        }

        function checkBunkerCollision(bx, by, bw, bh) {
            for (const bk of bunkers) {
                // Bounding box check zuerst
                const w = spriteWidth(BUNKER_SPRITE) * bk.scale;
                const h = spriteHeight(BUNKER_SPRITE) * bk.scale;
                if (bx + bw <= bk.x || bx >= bk.x + w ||
                    by + bh <= bk.y || by >= bk.y + h) continue;
                if (bunkerPixelHit(bk, bx, by, bw, bh)) return true;
            }
            return false;
        }

        function drawBunkers() {
            for (const bk of bunkers) {
                drawSprite(ctx, bk.grid.map(r => r.join('')), Math.round(bk.x), Math.round(bk.y), bk.scale, '#3cff3c');
            }
        }
        // ---------- Spiel-State ----------
        const STATE = { START: 'START', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' };
        let state = STATE.START;
        let score = 0;
        let wave = 1;
        let speedMultiplier = 1;

        const hudEl = document.getElementById('hud');
        const scoreEl = document.getElementById('scoreLabel');
        const waveEl = document.getElementById('waveLabel');
        const quitBtn = document.getElementById('quitBtn');

        function updateHud() {
            scoreEl.textContent = 'SCORE: ' + String(score).padStart(4, '0');
            waveEl.textContent  = 'WAVE ' + wave;
            if (state === STATE.PLAYING || state === STATE.GAME_OVER) {
                hudEl.classList.add('visible');
            } else {
                hudEl.classList.remove('visible');
            }
            if (isTouch && state === STATE.PLAYING) {
                quitBtn.classList.add('visible');
            } else {
                quitBtn.classList.remove('visible');
            }
        }

        function resetAliens() {
            aliens.length = 0;
            for (let r = 0; r < ALIEN_ROWS; r++) {
                for (let c = 0; c < ALIEN_COLS; c++) {
                    aliens.push({ row: r, col: c, alive: true, type: r });
                }
            }
            formation.dir = 1;
            computeFormation();
            lastAlienTick = performance.now();
            marchStep = 0;
        }

        function startGame() {
            ensureAudio();
            score = 0;
            wave = 1;
            speedMultiplier = 1;
            bullets.length = 0;
            alienBullets.length = 0;
            resetAliens();
            buildBunkers();
            resetPlayerPosition();
            scheduleNextAlienShot();
            state = STATE.PLAYING;
            updateHud();
        }

        function nextWave() {
            wave += 1;
            speedMultiplier *= 1.5;
            bullets.length = 0;
            alienBullets.length = 0;
            resetAliens();
            buildBunkers();
            scheduleNextAlienShot();
        }

        function gameOver() {
            state = STATE.GAME_OVER;
            playGameOver();
            updateHud();
        }

        function backToStart() {
            state = STATE.START;
            bullets.length = 0;
            alienBullets.length = 0;
            resetAliens();
            updateHud();
        }

        // Tastatur-Aktionen fuer State-Wechsel
        document.addEventListener('keydown', (e) => {
            const k = (e.key === ' ' || e.code === 'Space') ? 'Space' : e.key;
            if (k === 'Space') {
                if (state === STATE.START) startGame();
                else if (state === STATE.GAME_OVER) backToStart();
            }
            if (k === 'Escape' && state === STATE.PLAYING) {
                backToStart();
            }
        });

        // Canvas-Tap fuer Start/Restart
        canvas.addEventListener('touchstart', (e) => {
            if (state === STATE.START) { startGame(); e.preventDefault(); }
            else if (state === STATE.GAME_OVER) { backToStart(); e.preventDefault(); }
        }, { passive: false });
        // Desktop-Klick aufs Canvas (z.B. wenn Touch-Sim oder Maus)
        canvas.addEventListener('click', () => {
            if (state === STATE.START) startGame();
            else if (state === STATE.GAME_OVER) backToStart();
        });

        quitBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state === STATE.PLAYING) backToStart();
        });
        quitBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (state === STATE.PLAYING) backToStart();
        }, { passive: false });

        updateHud();

        // ---------- Game-Loop ----------
        let lastTime = performance.now();

        function update(dt) {
            const scale = getSpriteScale();
            const pw = spriteWidth(PLAYER_SPRITE) * scale;
            const ph = spriteHeight(PLAYER_SPRITE) * scale;

            // Spieler-Y immer aktuell
            player.y = canvas.height - ph - 30;

            if (state !== STATE.PLAYING) {
                // In START / GAME_OVER nur passiv
                return;
            }

            // Querung in ~2.5 s -> speed = canvas.width / 2.5 px/s
            player.speed = canvas.width / 2.5;

            // Tastatur
            if (keys['ArrowLeft']  || keys['a'] || keys['A']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed * dt;
            }

            // Touch (Drag): Schiff folgt Finger horizontal, geglaettet mit Speed-Cap
            if (touchTargetX !== null) {
                const desired = touchTargetX - pw / 2;
                const dx = desired - player.x;
                const maxStep = player.speed * dt * 2;
                player.x += Math.max(-maxStep, Math.min(maxStep, dx));
            }

            // Begrenzung
            if (player.x < 0) player.x = 0;
            if (player.x + pw > canvas.width) player.x = canvas.width - pw;

            // Schiessen
            if (keys['Space']) tryShoot();

            // Geschosse bewegen
            const bulletSpeed = canvas.height / 1.0; // px/s
            const bh = spriteHeight(BULLET_SPRITE) * scale;
            const bw = spriteWidth(BULLET_SPRITE) * scale;
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed * dt;
                if (bullets[i].y + bh < 0) {
                    bullets.splice(i, 1);
                    continue;
                }
                // Bunker zuerst (klassisch: eigener Schuss zerstoert Bunker)
                if (checkBunkerCollision(bullets[i].x, bullets[i].y, bw, bh)) {
                    bullets.splice(i, 1);
                    continue;
                }
                // Kollision mit Aliens (AABB)
                let hit = false;
                for (const a of aliens) {
                    if (!a.alive) continue;
                    const p = alienRenderPos(a);
                    if (bullets[i].x < p.x + p.w &&
                        bullets[i].x + bw > p.x &&
                        bullets[i].y < p.y + p.h &&
                        bullets[i].y + bh > p.y) {
                        a.alive = false;
                        score += ALIEN_TYPES[a.type].points;
                        playHit();
                        hit = true;
                        break;
                    }
                }
                if (hit) bullets.splice(i, 1);
            }

            // Alien-Geschosse bewegen
            const abSpeed = canvas.height / 1.5;
            const abw = spriteWidth(ALIEN_BULLET_SPRITE) * scale;
            const abh = spriteHeight(ALIEN_BULLET_SPRITE) * scale;
            for (let i = alienBullets.length - 1; i >= 0; i--) {
                alienBullets[i].y += abSpeed * dt;
                if (alienBullets[i].y > canvas.height) {
                    alienBullets.splice(i, 1);
                    continue;
                }
                // Bunker
                if (checkBunkerCollision(alienBullets[i].x, alienBullets[i].y, abw, abh)) {
                    alienBullets.splice(i, 1);
                    continue;
                }
                // Spieler getroffen
                if (alienBullets[i].x < player.x + pw &&
                    alienBullets[i].x + abw > player.x &&
                    alienBullets[i].y < player.y + ph &&
                    alienBullets[i].y + abh > player.y) {
                    alienBullets.splice(i, 1);
                    playHit();
                    gameOver();
                    return;
                }
            }

            // Alien-Schuss-Trigger
            if (performance.now() >= nextAlienShootAt) {
                alienShoot();
                scheduleNextAlienShot();
            }

            // Welle abgeschlossen?
            if (aliveAliens() === 0) {
                nextWave();
                updateHud();
                return;
            }

            // Alien-Marsch (Tick-basiert)
            const now = performance.now();
            const interval = alienTickInterval(aliveAliens()) / speedMultiplier;
            if (now - lastAlienTick >= interval) {
                lastAlienTick = now;
                stepAliens();
            }

            // Game Over: Alien erreicht Y-Position des Spielers
            for (const a of aliens) {
                if (!a.alive) continue;
                const p = alienRenderPos(a);
                if (p.y + p.h >= player.y) {
                    gameOver();
                    break;
                }
            }

            updateHud();
        }

        function drawCenteredText(text, y, size, color = '#fff') {
            ctx.fillStyle = color;
            ctx.font = `bold ${size}px 'Courier New', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, y);
        }

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const scale = getSpriteScale();

            // Player + Bullets nur sichtbar in PLAYING/GAME_OVER
            if (state !== STATE.START) {
                drawSprite(ctx, PLAYER_SPRITE, Math.round(player.x), Math.round(player.y), scale, '#ffffff');
                for (const b of bullets) {
                    drawSprite(ctx, BULLET_SPRITE, Math.round(b.x), Math.round(b.y), scale, '#ffffff');
                }
                for (const b of alienBullets) {
                    drawSprite(ctx, ALIEN_BULLET_SPRITE, Math.round(b.x), Math.round(b.y), scale, '#ffffff');
                }
                drawBunkers();
                for (const a of aliens) {
                    if (!a.alive) continue;
                    const t = ALIEN_TYPES[a.type];
                    const p = alienRenderPos(a);
                    drawSprite(ctx, t.sprite, Math.round(p.x), Math.round(p.y), formation.scale, '#ffffff');
                }
            }

            if (state === STATE.START) {
                drawCenteredText('SPACE INVADERS', canvas.height * 0.4, Math.floor(canvas.width * 0.07));
                const prompt = isTouch ? 'TAP TO START' : 'PRESS SPACE TO START';
                drawCenteredText(prompt, canvas.height * 0.6, Math.floor(canvas.width * 0.035));
            } else if (state === STATE.GAME_OVER) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawCenteredText('GAME OVER', canvas.height * 0.35, Math.floor(canvas.width * 0.08), '#ff4444');
                drawCenteredText('SCORE: ' + String(score).padStart(4, '0'),
                    canvas.height * 0.5, Math.floor(canvas.width * 0.04));
                drawCenteredText('REACHED WAVE ' + wave,
                    canvas.height * 0.58, Math.floor(canvas.width * 0.035));
                // Blink
                if (Math.floor(performance.now() / 500) % 2 === 0) {
                    const prompt = isTouch ? 'TAP TO RESTART' : 'PRESS SPACE TO RESTART';
                    drawCenteredText(prompt, canvas.height * 0.72, Math.floor(canvas.width * 0.035));
                }
            }
        }

        function loop(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
