<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2.5rem);
            letter-spacing: 0.25em;
            text-align: center;
            color: #fff;
        }
        #game {
            display: block;
            background: #000;
            border: 1px solid #fff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>SPACE INVADERS</h1>
        <canvas id="game"></canvas>
    </div>

    <script type="module">
        import {
            PLAYER_SPRITE, BULLET_SPRITE,
            TUX_SPRITE, WINDOWS_SPRITE, CREEPER_SPRITE,
            drawSprite, spriteWidth, spriteHeight
        } from './js/sprites.js';

        // ---------- Browser-/Device-Detection ----------
        const isTouch = 'ontouchstart' in window
            || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        window.__isTouch = isTouch; // global verfuegbar fuer spaetere Phasen

        // ---------- Canvas-Setup, responsive 4:3 ----------
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const maxWidth = 800;
            const titleAndPadding = 120;
            const availW = window.innerWidth * 0.95;
            const availH = window.innerHeight - titleAndPadding;

            let w = Math.min(maxWidth, availW);
            let h = w * 3 / 4;
            if (h > availH) {
                h = availH;
                w = h * 4 / 3;
            }
            canvas.width  = Math.floor(w);
            canvas.height = Math.floor(h);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            resetPlayerPosition();
            computeFormation();
        });
        resizeCanvas();

        // ---------- Sprite-Skalierung ----------
        function getSpriteScale(baseFactor = 1) {
            const factor = canvas.width >= 600 ? 3 : 2;
            return factor * baseFactor;
        }

        // ---------- Spielerzustand ----------
        const player = {
            x: 0,
            y: 0,
            speed: 0 // px/s, wird pro Frame anhand Canvas-Breite gesetzt
        };

        function resetPlayerPosition() {
            const scale = getSpriteScale();
            const w = spriteWidth(PLAYER_SPRITE) * scale;
            const h = spriteHeight(PLAYER_SPRITE) * scale;
            player.x = (canvas.width - w) / 2;
            player.y = canvas.height - h - 30;
        }
        resetPlayerPosition();

        // ---------- Audio (Web Audio API, lazy + iOS-Unlock) ----------
        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                const Ctor = window.AudioContext || window.webkitAudioContext;
                if (Ctor) audioCtx = new Ctor();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        function playPew() {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, t0);
            osc.frequency.exponentialRampToValueAtTime(200, t0 + 0.08);
            gain.gain.setValueAtTime(0.15, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.08);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.09);
        }
        const MARCH_FREQS = [100, 90, 80, 70];
        function playMarch(step) {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(MARCH_FREQS[step % 4], t0);
            gain.gain.setValueAtTime(0.08, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.11);
        }
        // User-Geste -> Audio entsperren
        ['keydown', 'click', 'touchstart'].forEach(ev => {
            window.addEventListener(ev, ensureAudio, { passive: true });
        });

        // ---------- Input: Tastatur ----------
        const keys = Object.create(null);
        document.addEventListener('keydown', (e) => {
            // Space normalisieren auf 'Space'
            const k = (e.key === ' ' || e.code === 'Space') ? 'Space' : e.key;
            keys[k] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const k = (e.key === ' ' || e.code === 'Space') ? 'Space' : e.key;
            keys[k] = false;
        });

        // ---------- Input: Touch (Drag) ----------
        let touchTargetX = null; // Ziel-X (Mitte des Schiffs) in Canvas-Koordinaten

        function handleTouch(e) {
            if (!e.touches || e.touches.length === 0) return;
            const t = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const cssX = t.clientX - rect.left;
            touchTargetX = cssX * (canvas.width / rect.width);
            e.preventDefault();
        }
        function endTouch(e) {
            touchTargetX = null;
        }
        canvas.addEventListener('touchstart',  handleTouch, { passive: false });
        canvas.addEventListener('touchmove',   handleTouch, { passive: false });
        canvas.addEventListener('touchend',    endTouch,    { passive: false });
        canvas.addEventListener('touchcancel', endTouch,    { passive: false });

        // ---------- Touch Auto-Fire ----------
        // Auf Touch-Devices alle 500ms automatisch schiessen, solange Spiel laeuft.
        // Phase 7 fuehrt PLAYING-State ein; bis dahin: gameRunning = true.
        const gameRunning = true;
        if (isTouch) {
            setInterval(() => {
                if (gameRunning) keys['Space'] = true;
            }, 500);
        }

        // ---------- Geschosse ----------
        const bullets = [];
        let lastShoot = 0;
        const SHOOT_COOLDOWN_MS = 250;

        function tryShoot() {
            const now = Date.now();
            if (now - lastShoot < SHOOT_COOLDOWN_MS) return;
            lastShoot = now;

            const scale = getSpriteScale();
            const pw = spriteWidth(PLAYER_SPRITE) * scale;
            const bw = spriteWidth(BULLET_SPRITE) * scale;
            const bh = spriteHeight(BULLET_SPRITE) * scale;

            bullets.push({
                x: player.x + pw / 2 - bw / 2,
                y: player.y - bh
            });
            playPew();

            // Auto-Fire-Trigger sofort zuruecksetzen, naechster Tick setzt wieder true
            if (isTouch) keys['Space'] = false;
        }

        // ---------- Alien-Formation ----------
        // Reihe 0: TUX (30), Reihen 1-2: WINDOWS (20), Reihe 3: CREEPER (10)
        const ALIEN_ROWS = 4;
        const ALIEN_COLS = 11;
        const ALIEN_TYPES = [
            { sprite: TUX_SPRITE,     points: 30 },
            { sprite: WINDOWS_SPRITE, points: 20 },
            { sprite: WINDOWS_SPRITE, points: 20 },
            { sprite: CREEPER_SPRITE, points: 10 }
        ];
        // Einheitliche Zellbreite/-hoehe basierend auf groesstem Sprite
        const ALIEN_CELL_W = Math.max(
            spriteWidth(TUX_SPRITE),
            spriteWidth(WINDOWS_SPRITE),
            spriteWidth(CREEPER_SPRITE)
        );
        const ALIEN_CELL_H = Math.max(
            spriteHeight(TUX_SPRITE),
            spriteHeight(WINDOWS_SPRITE),
            spriteHeight(CREEPER_SPRITE)
        );

        const aliens = [];
        for (let r = 0; r < ALIEN_ROWS; r++) {
            for (let c = 0; c < ALIEN_COLS; c++) {
                aliens.push({ row: r, col: c, alive: true, type: r });
            }
        }

        // Formations-Layout (wird bei Resize neu berechnet)
        const formation = {
            scale: 3,
            colSpacing: 0,
            rowSpacing: 0,
            offsetX: 0,
            offsetY: 0,
            dir: 1, // 1 = rechts, -1 = links
            blockW: 0,
            blockH: 0
        };

        function computeFormation() {
            const mobile = canvas.width < 600;
            // Basis-Skalierung: Desktop 3, Mobile 1.5
            let scale = mobile ? 1.5 : 3;

            // Spacing in % der Sprite-Zellbreite/-hoehe
            // Spalten dynamisch reduzieren, damit Block + 15% Padding pro Seite passt
            const maxBlockW = canvas.width * 0.7;
            let colSpacing;
            // Probiere Skalierung ggf. reduzieren
            while (true) {
                const renderW = ALIEN_CELL_W * scale;
                colSpacing = Math.max(2, renderW * 0.25);
                const blockW = renderW * ALIEN_COLS + colSpacing * (ALIEN_COLS - 1);
                if (blockW <= maxBlockW || scale <= 0.5) break;
                scale -= 0.1;
            }

            const renderW = ALIEN_CELL_W * scale;
            const renderH = ALIEN_CELL_H * scale;
            const rowSpacing = mobile ? canvas.height * 0.03 : canvas.height * 0.05;
            const blockW = renderW * ALIEN_COLS + colSpacing * (ALIEN_COLS - 1);
            const blockH = renderH * ALIEN_ROWS + rowSpacing * (ALIEN_ROWS - 1);
            const topPad = (mobile ? 0.08 : 0.13) * canvas.height;

            formation.scale = scale;
            formation.colSpacing = colSpacing;
            formation.rowSpacing = rowSpacing;
            formation.offsetX = (canvas.width - blockW) / 2;
            formation.offsetY = topPad;
            formation.blockW = blockW;
            formation.blockH = blockH;
        }
        computeFormation();

        function alienRenderPos(a) {
            const renderW = ALIEN_CELL_W * formation.scale;
            const renderH = ALIEN_CELL_H * formation.scale;
            const x = formation.offsetX + a.col * (renderW + formation.colSpacing);
            const y = formation.offsetY + a.row * (renderH + formation.rowSpacing);
            // Sprite innerhalb der Zelle zentrieren
            const sw = spriteWidth(ALIEN_TYPES[a.type].sprite) * formation.scale;
            const sh = spriteHeight(ALIEN_TYPES[a.type].sprite) * formation.scale;
            return { x: x + (renderW - sw) / 2, y: y + (renderH - sh) / 2, w: sw, h: sh };
        }

        // Tempo: linear 900ms (44 alive) -> 150ms (1 alive)
        function alienTickInterval(aliveCount) {
            if (aliveCount <= 1) return 150;
            return 150 + (900 - 150) * (aliveCount - 1) / (ALIEN_ROWS * ALIEN_COLS - 1);
        }

        let lastAlienTick = 0;
        let marchStep = 0;

        function stepAliens() {
            const renderW = ALIEN_CELL_W * formation.scale;
            const stepX = renderW * 0.2; // horizontaler Schritt
            const stepY = canvas.height * 0.045;

            // Lebende Aliens links/rechts pruefen
            let minX = Infinity, maxX = -Infinity;
            for (const a of aliens) {
                if (!a.alive) continue;
                const p = alienRenderPos(a);
                if (p.x < minX) minX = p.x;
                if (p.x + p.w > maxX) maxX = p.x + p.w;
            }
            if (minX === Infinity) return; // keine mehr

            const nextMin = minX + stepX * formation.dir;
            const nextMax = maxX + stepX * formation.dir;
            if (nextMax > canvas.width || nextMin < 0) {
                formation.dir *= -1;
                formation.offsetY += stepY;
            } else {
                formation.offsetX += stepX * formation.dir;
            }

            playMarch(marchStep++);
        }

        function aliveAliens() {
            let n = 0;
            for (const a of aliens) if (a.alive) n++;
            return n;
        }

        // ---------- Game-Loop ----------
        let lastTime = performance.now();

        function update(dt) {
            const scale = getSpriteScale();
            const pw = spriteWidth(PLAYER_SPRITE) * scale;
            const ph = spriteHeight(PLAYER_SPRITE) * scale;

            // Querung in ~2.5 s -> speed = canvas.width / 2.5 px/s
            player.speed = canvas.width / 2.5;

            // Tastatur
            if (keys['ArrowLeft']  || keys['a'] || keys['A']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed * dt;
            }

            // Touch (Drag): Schiff folgt Finger horizontal, geglaettet mit Speed-Cap
            if (touchTargetX !== null) {
                const desired = touchTargetX - pw / 2;
                const dx = desired - player.x;
                const maxStep = player.speed * dt * 2;
                player.x += Math.max(-maxStep, Math.min(maxStep, dx));
            }

            // Y immer am unteren Rand halten (auch bei Resize)
            player.y = canvas.height - ph - 30;

            // Begrenzung
            if (player.x < 0) player.x = 0;
            if (player.x + pw > canvas.width) player.x = canvas.width - pw;

            // Schiessen
            if (keys['Space']) tryShoot();

            // Geschosse bewegen (Querung von unten nach oben in ~1s)
            const bulletSpeed = canvas.height / 1.0; // px/s
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed * dt;
                if (bullets[i].y + spriteHeight(BULLET_SPRITE) * scale < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Alien-Marsch (Tick-basiert, Tempo abhaengig von Anzahl)
            const now = performance.now();
            const interval = alienTickInterval(aliveAliens());
            if (now - lastAlienTick >= interval) {
                lastAlienTick = now;
                stepAliens();
            }
        }

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const scale = getSpriteScale();
            drawSprite(ctx, PLAYER_SPRITE, Math.round(player.x), Math.round(player.y), scale, '#ffffff');

            // Geschosse
            for (const b of bullets) {
                drawSprite(ctx, BULLET_SPRITE, Math.round(b.x), Math.round(b.y), scale, '#ffffff');
            }

            // Aliens
            for (const a of aliens) {
                if (!a.alive) continue;
                const t = ALIEN_TYPES[a.type];
                const p = alienRenderPos(a);
                // TUX und CREEPER haben eigene Palette; WINDOWS auch. Farbe '#ffffff' wirkt nur auf 'X'.
                drawSprite(ctx, t.sprite, Math.round(p.x), Math.round(p.y), formation.scale, '#ffffff');
            }
        }

        function loop(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
